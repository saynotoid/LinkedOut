# Global exclusions
sonar.exclusions=**/*.dll, **/*.exe, **/bin/**, **/obj/**

# Backend: Exclude auto-generated EF Core migrations
sonar.dotnet.excludeTestProjects=true
sonar.exclusions=src/backend/LinkedOut.Api/Data/Migrations/**/*

# Frontend: Prepare for future Angular (exclude dependencies and builds)
sonar.javascript.exclusions=**/node_modules/**, **/dist/**, **/coverage/**
